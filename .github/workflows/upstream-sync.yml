name: Upstream sync

# Looks twice a day for a new release in upstream's bpc_uploads. When there is
# one, its release files become a commit on the branch "upstream-sync"; the
# Safari build is made from that commit and tested (the Node tests and, where
# switched on, the WebKit engine and Safari app tests); and only when
# everything passes does the commit go to main, where the "Safari extension"
# workflow builds the packages and publishes them as a release. When something
# fails, main stays as it is and an issue says so.
#
# The jobs that run upstream's code (the tests) can only read the repository.
# The jobs that can write to it run this repository's own scripts, and take
# nothing from upstream but release files (tools/sync-upstream.mjs).
#
# What it costs (a private repository pays for Actions by the minute, each job
# rounded up, macOS tenfold): a check that finds nothing new is one job of
# under a minute. A new release is about five minutes on Linux and one on
# macOS (the packaging). The WebKit engine and Safari app tests are ten more
# minutes on macOS, so they only run when the repository variable
# UPSTREAM_SYNC_ENGINE_TEST is "on"; without it a release is accepted on the
# Node tests.

on:
  schedule:
    - cron: '23 4,16 * * *' # UTC
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Go through every step with an empty commit when upstream has nothing new (to test this workflow)
        type: boolean
        default: false
  # A dry run for changes to the sync itself: can upstream be reached, does the script run.
  pull_request:
    paths:
      - 'tools/sync-upstream.mjs'
      - '.github/workflows/upstream-sync.yml'

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CANDIDATE_BRANCH: upstream-sync
  ISSUE_LABEL: upstream-sync

jobs:
  dry-run:
    name: Compare with upstream (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-upstream.mjs --check

  check:
    name: Look for a new upstream release
    # Only for main: a run started by hand from another branch would move main to that branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes the candidate branch
      issues: write # closes the issue about an earlier failure
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      proceed: ${{ steps.candidate.outputs.proceed }}
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
      version: ${{ steps.sync.outputs.version }}
      upstream: ${{ steps.sync.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The token is given to the one step that pushes.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare with upstream
        id: sync
        run: node tools/sync-upstream.mjs --message "$RUNNER_TEMP/message.txt"
      - name: Commit to the candidate branch
        id: candidate
        if: steps.sync.outputs.changed == 'true' || inputs.rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.sync.outputs.changed }}
          UPSTREAM: ${{ steps.sync.outputs.upstream }}
          MESSAGE_FILE: ${{ runner.temp }}/message.txt
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash tools/ci/candidate.sh
      # Nothing new: an earlier failure is over (in this job, to keep such a run to one job).
      - name: Close the issue about an earlier failure
        if: steps.sync.outputs.changed == 'false' && !inputs.rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANGED: 'false'
          PROCEED: ''
          PROMOTE: skipped
          VERSION: ${{ steps.sync.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/ci/report.sh

  test:
    name: Build and test the candidate
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      failures: ${{ steps.failures.outputs.text }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Safari extension
        run: node safari/build.mjs --zip 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Run tests
        run: node --test --test-concurrency=1 safari/test/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Build the Chrome release with the site fixes
        run: node chrome/build.mjs 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: What failed
        id: failures
        if: failure()
        run: |
          delimiter="END_$(openssl rand -hex 16)"
          {
            echo "text<<$delimiter"
            grep -h -E '^build failed' "$RUNNER_TEMP/build.log" 2>/dev/null | head -5 || true
            grep -h -E '^not ok ' "$RUNNER_TEMP/test.log" 2>/dev/null | head -20 || true
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  engine:
    name: Engine test of the candidate
    needs: [check, test]
    if: needs.check.outputs.proceed == 'true' && vars.UPSTREAM_SYNC_ENGINE_TEST == 'on'
    permissions:
      contents: read
    uses: ./.github/workflows/safari-engine.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  promote:
    name: Accept the candidate on main
    needs: [check, test, engine]
    if: >-
      always() && needs.check.outputs.proceed == 'true' && needs.test.result == 'success' &&
      (needs.engine.result == 'success' || (needs.engine.result == 'skipped' && vars.UPSTREAM_SYNC_ENGINE_TEST != 'on'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # moves main
      actions: write # starts the packaging workflow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Move main to the candidate
        env:
          SHA: ${{ needs.check.outputs.sha }}
          BASE: ${{ needs.check.outputs.base }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash tools/ci/promote.sh
      - name: Build and publish the packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A push made with the workflow's token starts no workflow, so this one is started by name.
        run: gh workflow run safari.yml --ref main

  report:
    name: Open or close the issue about the sync
    needs: [check, test, engine, promote]
    if: always() && needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANGED: ${{ needs.check.outputs.changed }}
          PROCEED: ${{ needs.check.outputs.proceed }}
          VERSION: ${{ needs.check.outputs.version }}
          UPSTREAM: ${{ needs.check.outputs.upstream }}
          BASE: ${{ needs.check.outputs.base }}
          SHA: ${{ needs.check.outputs.sha }}
          TEST: ${{ needs.test.result }}
          ENGINE: ${{ needs.engine.result }}
          PROMOTE: ${{ needs.promote.result }}
          FAILURES: ${{ needs.test.outputs.failures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/ci/report.sh
