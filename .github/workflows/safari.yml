name: Safari extension

on:
  # Branch work is covered by the pull_request trigger; push only runs on main
  # so that a push to a PR branch does not build twice.
  push:
    branches: [main]
    paths:
      - 'safari/**'
      - '!safari/engine/**'
      - 'bypass-paywalls-chrome-clean-master.zip'
      - 'bypass-paywalls-firefox-clean-master.zip'
      - 'chrome/**'
      - '.github/workflows/safari.yml'
  pull_request:
    paths:
      - 'safari/**'
      - '!safari/engine/**'
      - 'bypass-paywalls-chrome-clean-master.zip'
      - 'bypass-paywalls-firefox-clean-master.zip'
      - 'chrome/**'
      - '.github/workflows/safari.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shown on the extension's diagnostics page, so that an installed copy can be
  # traced back to the commit it was built from.
  BPC_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: Build and test the extension folder
    runs-on: ubuntu-latest
    outputs:
      build-number: ${{ steps.build.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Safari extension folder
        id: build
        run: |
          node safari/build.mjs --zip
          echo "number=$(node -p 'require("./build/safari/extension/safari-build.json").build.number')" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: node --test --test-concurrency=1 safari/test/*.test.mjs
      - name: Upload extension folder
        uses: actions/upload-artifact@v4
        with:
          name: safari-extension
          path: build/safari/bypass-paywalls-clean-safari-*.zip
          if-no-files-found: error
      - name: Build Chrome release with the site fixes
        run: node chrome/build.mjs
      - name: Upload Chrome release with the site fixes
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-fixed
          path: build/chrome/bypass-paywalls-chrome-clean-*-fixed.zip
          if-no-files-found: error

  xcode:
    name: Wrap in macOS/iOS app with Xcode
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_NAME: Bypass Paywalls Clean
      BUNDLE_ID: io.github.aavalon-sys.bypass-paywalls-clean
      # The same build number as the extension folder built above.
      BPC_BUILD_NUMBER: ${{ needs.test.outputs.build-number }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Safari extension folder
        run: node safari/build.mjs
      - name: Show Xcode and converter versions
        run: |
          xcodebuild -version
          xcrun --find safari-web-extension-converter || true
          xcrun --find safari-web-extension-packager || true
          xcrun safari-web-extension-converter --help || true
      - name: Generate Xcode project
        run: safari/xcode/convert.sh build/safari/extension build/safari/xcode
      - name: Build macOS app (ad-hoc signed)
        run: safari/xcode/build-app.sh build/safari/xcode macos build/safari/dd
      - name: Build iOS app (unsigned)
        run: safari/xcode/build-app.sh build/safari/xcode ios build/safari/dd
      - name: Package unsigned IPA
        run: |
          safari/xcode/make-ipa.sh build/safari/dd dist/Bypass-Paywalls-Clean-unsigned.ipa
          unzip -l dist/Bypass-Paywalls-Clean-unsigned.ipa | grep -E 'appex/(manifest\.json|safari-compat\.js|Info\.plist)$'
      - name: Check the built app
        run: |
          APP=$(find build/safari/dd/Build/Products -maxdepth 2 -name '*.app' -path '*Release/*' | head -1)
          echo "App: $APP"
          APPEX=$(find "$APP" -name '*.appex' | head -1)
          echo "Extension: $APPEX"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APPEX/Contents/Info.plist"
          test -f "$APPEX/Contents/Resources/manifest.json"
          test -f "$APPEX/Contents/Resources/safari-compat.js"
          # The app and its extension carry this build's number, so that a newer copy counts as newer.
          BUILD=$(node -p 'require("./build/safari/extension/safari-build.json").build.number')
          echo "Build number: $BUILD, commit $BPC_BUILD_COMMIT"
          test "$BUILD" = "$BPC_BUILD_NUMBER"
          test "$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")" = "$BUILD"
          test "$(plutil -extract CFBundleVersion raw "$APPEX/Contents/Info.plist")" = "$BUILD"
          plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist"
          grep -q "\"$BPC_BUILD_COMMIT\"" "$APPEX/Contents/Resources/safari-build.json"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "dist/Bypass-Paywalls-Clean-macOS.zip"
          (cd build/safari && zip -qr ../../dist/Bypass-Paywalls-Clean-Xcode-project.zip xcode)
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: safari-macos-app
          path: dist/Bypass-Paywalls-Clean-macOS.zip
          if-no-files-found: error
      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: safari-ios-ipa-unsigned
          path: dist/Bypass-Paywalls-Clean-unsigned.ipa
          if-no-files-found: error
      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: safari-xcode-project
          path: dist/Bypass-Paywalls-Clean-Xcode-project.zip
          if-no-files-found: error
