<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPC Safari 诊断</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --ok: #1a7f37; --bad: #c62828; --warn: #a15c00; --box: #f5f5f7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #a1a1a6; --ok: #4ac26b; --bad: #ff6b6b; --warn: #f0b429; --box: #2c2c2e; }
    }
    body { background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; margin: 0 auto; padding: 16px; max-width: 760px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 20px 0 8px; }
    p.hint { color: var(--muted); margin: 0 0 12px; }
    ul#verdict { padding-left: 20px; margin: 0; }
    ul#verdict li { margin: 6px 0; }
    .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
    textarea { width: 100%; box-sizing: border-box; min-height: 320px; background: var(--box); color: var(--fg); border: 0; border-radius: 8px; padding: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
    button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--box); color: var(--fg); margin: 8px 8px 0 0; }
  </style>
</head>
<body>
  <h1>Bypass Paywalls Clean · Safari 诊断</h1>
  <p class="hint">请在要测试的新闻网站上点开扩展图标，再点弹窗里的「Safari 诊断」打开本页，这样才能检测那个网站。</p>
  <h2>结论</h2>
  <ul id="verdict"><li>检测中…</li></ul>
  <h2>详细信息（反馈问题时请复制全部内容）</h2>
  <textarea id="report" readonly>检测中…</textarea>
  <div>
    <button id="copy">复制报告</button>
    <button id="reload">重新检测</button>
  </div>
  <script src="safari-diagnostics.js"></script>
</body>
</html>
